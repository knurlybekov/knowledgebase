{% extends "base.html" %}
{% block content %}
<h1 class="mb-4 text-xl font-semibold">Password reset</h1>
{% if form %}<form method="post" class="max-w-sm space-y-3">{% csrf_token %}{{ form.as_p }}<button class="rounded bg-slate-900 px-3 py-1.5 text-white" type="submit">Continue</button></form>
{% else %}<p>If the address exists, an email with the next step was sent.</p>{% endif %}
{% endblock %}
