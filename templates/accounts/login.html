{% extends "base.html" %}
{% block title %}Log in · Knowledgebase{% endblock %}
{% block content %}
<div class="mx-auto mt-6 max-w-md sm:mt-16">
    <div class="card raised p-6 sm:p-8">
      <h1 class="h1 mb-1">Log in</h1>
      <p class="muted mb-6 text-sm">Answers cite only the files your account can open.</p>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if form.errors %}<p class="rounded-lg bg-bad-soft px-3 py-2 text-sm text-bad" role="alert">The email or password is not correct.</p>{% endif %}
        <label class="block text-sm"><span class="label mb-1 block">Email</span><input class="field" type="email" name="username" autocomplete="username" required autofocus></label>
        <label class="block text-sm"><span class="label mb-1 block">Password</span><input class="field" type="password" name="password" autocomplete="current-password" required></label>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-full justify-center" type="submit">Log in</button>
        <p class="text-center text-sm"><a class="link" href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
      </form>
    </div>
</div>
{% endblock %}
