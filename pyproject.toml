[project]
name = "knowledgebase"
version = "0.1.0"
description = "Organizational Intelligence Platform: authorized document search, cited answers, Hermes investigations, decision records."
requires-python = ">=3.13,<3.15"
dependencies = [
    # Web framework. 6.1 is what the scaffold was generated with; stay on the 6.1 line.
    "django>=6.1,<6.2",
    # Postgres driver. Django 6 needs psycopg 3; the binary wheel bundles libpq.
    "psycopg[binary]>=3.2",
    # Vector column + HNSW index for Django. Provides HalfVectorField and CosineDistance.
    "pgvector>=0.3.6",
    # Typed settings from environment variables and .env.
    "django-environ>=0.12",
    # Background work: ingestion sync, investigations, reapers. Redis is the broker.
    "celery[redis]>=5.4",
    "redis>=5.2",
    # Periodic schedule uses Celery's static beat_schedule in settings:
    # django-celery-beat 2.9 pins Django < 6.1, and the schedule here is fixed.
    # HTMX request helpers for the server-rendered UI.
    "django-htmx>=1.21",
    # Request validation for JSON endpoints and MCP tool arguments.
    "pydantic>=2.9",
    # Fernet encryption of connector refresh tokens.
    "cryptography>=43",
    # HTTP client for Microsoft Graph and the runner; retries live in connectors/http.py.
    "httpx>=0.27",
    # Microsoft identity platform OAuth (auth-code with refresh tokens).
    "msal>=1.31",
    # Google Drive API client and OAuth flow.
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    # Document parsers.
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    # Official Model Context Protocol SDK (FastMCP server, streamable HTTP).
    "mcp>=1.10",
    # LLM providers behind the Composer protocol.
    "anthropic>=0.40",
    "openai>=1.50",
    # Metrics endpoint for the internal network.
    "prometheus-client>=0.21",
    # Production serving.
    "gunicorn>=23",
    "uvicorn>=0.30",
    "whitenoise>=6.8",
    # Tailwind through the standalone binary; no node_modules in the Django tree.
    "django-tailwind-cli>=4.0",
    # Golden evaluation queries.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    # The runner is served from the Hermes image, but its code is tested here.
    "fastapi>=0.115",
    "psutil>=6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "knowledgebase.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
markers = [
    "hermes: live Hermes CLI contract tests; skipped without the image and a provider key.",
    "live: tests that call an external provider; skipped without credentials.",
    "slow: tests above 2 s wall clock.",
]
filterwarnings = ["ignore::DeprecationWarning:django.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
"eval/test_*.py" = ["E501"]
"answers/composer/base.py" = ["E501"]
"mcp_server/auth.py" = ["E501"]
"mcp_server/server.py" = ["E501"]
"mcp_server/tools.py" = ["E501"]
"hermes/runner/*" = ["E501"]
"decisions/mcp_tools.py" = ["E501"]
"decisions/extraction.py" = ["E501"]
"eval/runner.py" = ["E501"]
"investigations/fake_runner.py" = ["E501"]
"eval/management/commands/*" = ["E501"]
